<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robin | Substitute Developer</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky1: #050510;
      --sky2: #1a1040;
      --sky3: #3b1d5e;
      --moon: #fff1d0;
      --city: #000000;
      --fg: #f5f5f5;
      --accent: #ff6a00;
      --panel: rgba(10, 10, 20, 0.75);
      --spark: #ffb36b;
    }
    body.bankai {
      --sky1: #2b0008;
      --sky2: #7a0b1b;
      --sky3: #ff7b3d;
      --moon: #ffe9b0;
      --city: #1a0004;
      --fg: #fff;
      --accent: #ffd400;
      --panel: rgba(30, 0, 5, 0.75);
      --spark: #ffe28a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--sky1);
    }

    /* ===== LATAR ANIME ===== */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(to top, var(--sky3) 0%, var(--sky2) 45%, var(--sky1) 100%);
      transition: background 0.6s;
      overflow: hidden;
    }
    .moon {
      position: absolute;
      top: 8%;
      right: 12%;
      width: clamp(150px, 26vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: inset -0.14em 0.04em 0 0 var(--moon);
      font-size: clamp(150px, 26vw, 300px);
      filter: drop-shadow(0 0 25px var(--moon)) drop-shadow(0 0 70px var(--moon));
      transform: rotate(-20deg);
      transition: box-shadow 0.6s, filter 0.6s;
    }
    .kanji {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 45vw;
      font-weight: 900;
      color: var(--accent);
      opacity: 0.06;
      white-space: nowrap;
    }
    .city {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 38vh;
      color: var(--city);
      transition: color 0.6s;
    }
    .spark {
      position: absolute;
      bottom: -10px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--spark);
      box-shadow: 0 0 8px var(--spark);
      opacity: 0;
      animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    /* ===== KONTEN ===== */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 24px 120px;
    }
    .tag {
      display: inline-block;
      background: var(--fg);
      color: #000;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 3px;
      padding: 6px 12px;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(70px, 18vw, 140px);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    h1 span { color: var(--accent); transition: color 0.6s; }
    .sub {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      margin: 10px 0 20px;
      text-transform: uppercase;
    }
    .bio { max-width: 480px; line-height: 1.7; margin-bottom: 40px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    h2 {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-left: 8px solid var(--accent);
      padding-left: 12px;
      margin-bottom: 18px;
      transition: border-color 0.6s;
    }
    .skill {
      background: var(--panel);
      backdrop-filter: blur(4px);
      padding: 14px 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--fg);
    }
    .skill b { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; letter-spacing: 1px; }
    .bar { height: 8px; background: rgba(255,255,255,0.2); }
    .bar i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: background 0.6s; }
    .buttons { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: 3px solid var(--fg);
      background: rgba(0,0,0,0.3);
      color: var(--fg);
      padding: 12px 26px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--fg); color: #000; transform: translateY(-3px); }
    .btn.main { background: var(--accent); border-color: var(--accent); color: #000; }
    .btn.main:hover { background: var(--fg); border-color: var(--fg); }
    footer { margin-top: 50px; font-size: 12px; letter-spacing: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Latar anime -->
  <div class="scene" id="scene">
    <div class="kanji">死神</div>
    <div class="moon"></div>
    <svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="currentColor">
      <!-- tanah -->
      <rect x="0" y="270" width="1200" height="30"/>
      <!-- menara 1 -->
      <path d="M90 270 V190 H130 V270 Z"/>
      <path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/>
      <path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/>
      <path d="M95 150 L110 125 L125 150 Z"/>
      <!-- bangunan panjang -->
      <path d="M200 270 V215 H420 V270 Z"/>
      <path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <!-- menara utama -->
      <path d="M520 270 V160 H580 V270 Z"/>
      <path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/>
      <path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/>
      <path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/>
      <path d="M540 82 L550 50 L560 82 Z"/>
      <!-- bangunan tengah -->
      <path d="M680 270 V220 H860 V270 Z"/>
      <path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <!-- menara 2 -->
      <path d="M930 270 V185 H980 V270 Z"/>
      <path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/>
      <path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/>
      <path d="M938 140 L955 112 L972 140 Z"/>
      <!-- bangunan kanan -->
      <path d="M1060 270 V225 H1200 V270 Z"/>
      <path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="tag">SUBSTITUTE DEVELOPER</div>
    <h1>Ro<span>bin</span></h1>
    <p class="sub">Web Developer in Training</p>
    <p class="bio">
      Lagi berlatih menempa kemampuan coding, satu commit demi satu commit.
      Targetnya: dari pemula sampai mencapai Bankai.
    </p>

    <h2>Reiatsu (Skill)</h2>
    <div class="skill"><b><span>HTML</span><span>60%</span></b><div class="bar"><i style="width:60%"></i></div></div>
    <div class="skill"><b><span>CSS</span><span>50%</span></b><div class="bar"><i style="width:50%"></i></div></div>
    <div class="skill"><b><span>JavaScript</span><span>30%</span></b><div class="bar"><i style="width:30%"></i></div></div>
    <div class="skill"><b><span>Git &amp; GitHub</span><span>40%</span></b><div class="bar"><i style="width:40%"></i></div></div>

    <div class="buttons">
      <button class="btn main" id="bankaiBtn">Bankai!</button>
      <a class="btn" href="https://github.com/muqorobin298-lab" target="_blank">GitHub</a>
      <a class="btn" href="mailto:muqorobin298@gmail.com">Kontak</a>
    </div>

    <footer>© ROBIN · DIBUAT DENGAN SEMANGAT SOUL REAPER</footer>
  </div>

  <script>
    // Tombol Bankai
    const btn = document.getElementById('bankaiBtn');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('bankai');
      btn.textContent = document.body.classList.contains('bankai') ? 'Kembali!' : 'Bankai!';
    });

    // Partikel reiatsu melayang
    const scene = document.getElementById('scene');
    for (let i = 0; i < 35; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (6 + Math.random() * 8) + 's';
      s.style.animationDelay = (Math.random() * 10) + 's';
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + 'px';
      scene.appendChild(s);
    }
  </script>
</body>
</html>
